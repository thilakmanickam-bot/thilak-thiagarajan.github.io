plugins {
    id "com.android.application" version "8.2.0" apply false
    id "com.android.library" version "8.2.0" apply false
    id "org.jetbrains.kotlin.android" version "1.9.22" apply false
    id "org.jetbrains.kotlin.jvm" version "1.9.22" apply false
    // Firebase config plugin — processes app/google-services.json into resources.
    // Applied only in :app. A placeholder google-services.json keeps builds green
    // until a real Firebase project is configured (account login ships disabled).
    id "com.google.gms.google-services" version "4.4.2" apply false
}

ext {
    compileSdk = 36
    targetSdk = 36
    minSdk = 26
    // versionCode is overridden by CI (VERSION_CODE = the release run number),
    // so this local value only matters for local builds.
    versionCode = 1
    // Bump this on every rollout that carries a minor/major dependency update
    // or user-visible change — the app footer shows it, so a stale versionName
    // makes it impossible to tell from a deployed build whether it's current.
    // See docs/RELEASE_RUNBOOK.md ("Before every rollout").
    // 1.1.0: Play Billing 7.1.1 -> 9.1.0, onboarding wizard, bundled per-language
    //        fonts, chat proxy, Halo Premium billing, location-search fix.
    // 1.1.1: surface the real sign-in failure reason instead of a generic message.
    // 1.1.2: report Play Services status + Activity-context in sign-in failures.
    // 1.1.3: report the running build's signing certificate and whether it is
    //        registered; stop cancelling a slow sign-in (it destroyed the error).
    // 1.1.4: onboarding redesign — centred steps, a full-width sliding step
    //        indicator and Skip in the footer, gold hero on the first screen.
    // 1.1.5: report Play Services version and elapsed time in sign-in
    //        failures; show the reason on the onboarding screen too.
    // 1.1.6: birthplace search tolerates approximate spellings
    //        ("karaikudi" now finds "Kāraikkudi").
    // 1.1.7: matchmaking speaks of the groom and bride, and drops the emoji.
    // 1.1.8: database v3 — saved_matches table for saved marriage matches.
    // 1.1.9: matchmaking accepts an optional birth date, time and place, and
    //        works out the rasi and nakshatram from it.
    versionName = "1.1.9"

    // Dependency versions
    kotlinVersion = "1.9.22"
    composeVersion = "1.6.7"
    androidxVersion = "1.6.8"
    roomVersion = "2.6.1"
    retrofitVersion = "2.11.0"
    okhttpVersion = "4.12.0"

    // Account login / cloud sync (Firebase Auth + Firestore, Credential Manager
    // "Sign in with Google"). Used only in :app, gated behind Features.AUTH_ENABLED.
    firebaseBomVersion = "33.5.1"
    credentialsVersion = "1.3.0"
    googleIdVersion = "1.1.1"
    coroutinesPlayServicesVersion = "1.8.0"

    // Google Play Billing (Halo Premium subscriptions), used only in :app,
    // gated behind Features.BILLING_ENABLED. Play requires >= 8.0.0 to
    // accept an upload at all (7.x uploads are rejected outright, even
    // with billing unused/flag-off) — see release-play.yml run history.
    billingVersion = "9.1.0"
}
