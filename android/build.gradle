plugins {
    id "com.android.application" version "8.2.0" apply false
    id "com.android.library" version "8.2.0" apply false
    id "org.jetbrains.kotlin.android" version "1.9.22" apply false
    id "org.jetbrains.kotlin.jvm" version "1.9.22" apply false
    // Firebase config plugin — processes app/google-services.json into resources.
    // Applied only in :app. A placeholder google-services.json keeps builds green
    // until a real Firebase project is configured (account login ships disabled).
    id "com.google.gms.google-services" version "4.4.2" apply false
}

ext {
    compileSdk = 36
    targetSdk = 36
    minSdk = 26
    versionCode = 1
    versionName = "1.0.0"

    // Dependency versions
    kotlinVersion = "1.9.22"
    composeVersion = "1.6.7"
    androidxVersion = "1.6.8"
    roomVersion = "2.6.1"
    retrofitVersion = "2.11.0"
    okhttpVersion = "4.12.0"

    // Account login / cloud sync (Firebase Auth + Firestore, Credential Manager
    // "Sign in with Google"). Used only in :app, gated behind Features.AUTH_ENABLED.
    firebaseBomVersion = "33.5.1"
    credentialsVersion = "1.3.0"
    googleIdVersion = "1.1.1"
    coroutinesPlayServicesVersion = "1.8.0"

    // Google Play Billing (Halo Premium subscriptions), used only in :app,
    // gated behind Features.BILLING_ENABLED.
    billingVersion = "7.1.1"
}
