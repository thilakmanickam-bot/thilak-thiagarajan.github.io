plugins {
    id "com.android.application"
    id "org.jetbrains.kotlin.android"
    id "kotlin-kapt"
    id "com.google.gms.google-services"
}

android {
    namespace = "com.astrochart"
    compileSdk rootProject.ext.compileSdk

    // versionCode/versionName can be overridden from CI (VERSION_CODE / VERSION_NAME)
    // so each Play upload gets a unique, increasing code without editing the file.
    // Resolved into locals first to avoid Groovy parsing `versionCode (...).toInteger()`
    // as a method call with a chained method on its return value.
    def resolvedVersionCode = (System.getenv("VERSION_CODE") ?: rootProject.ext.versionCode.toString()).toInteger()
    def resolvedVersionName = System.getenv("VERSION_NAME") ?: rootProject.ext.versionName

    defaultConfig {
        applicationId = "com.techbyt.halo"
        minSdk rootProject.ext.minSdk
        targetSdk rootProject.ext.targetSdk
        versionCode resolvedVersionCode
        versionName resolvedVersionName

        testInstrumentationRunner = "androidx.test.runner.AndroidJUnitRunner"
        vectorDrawables.useSupportLibrary = true

        // AdMob application ID injected into the manifest. Set ADMOB_APP_ID in
        // gradle.properties (or as an env var / -P flag) to your real
        // "ca-app-pub-XXXXXXXX~YYYYYYYY"; defaults to Google's test app ID.
        def admobAppId = (project.findProperty("ADMOB_APP_ID")
            ?: System.getenv("ADMOB_APP_ID")
            ?: "ca-app-pub-3940256099942544~3347511713")
        manifestPlaceholders = [admobAppId: admobAppId]

        // Base URL of the deployed "Ask the Universe" chat proxy Cloud Function
        // (see /functions). Set CHAT_PROXY_BASE_URL in gradle.properties (or as
        // an env var / -P flag) to e.g.
        // "https://us-central1-halo-2b942.cloudfunctions.net/chatProxy/"
        // (trailing slash required — ChatClient.kt appends "v1/messages" to it).
        // Left blank by default so an unconfigured build fails obviously
        // (Retrofit rejects a blank base URL) instead of silently calling nothing.
        def chatProxyBaseUrl = (project.findProperty("CHAT_PROXY_BASE_URL")
            ?: System.getenv("CHAT_PROXY_BASE_URL")
            ?: "")
        buildConfigField "String", "CHAT_PROXY_BASE_URL", "\"${chatProxyBaseUrl}\""

        // URL of the deployed `verifyPurchase` Cloud Function (see
        // /functions/src/billing.ts) — a separate function from the chat proxy
        // above, so a separate URL. Set BILLING_VERIFY_BASE_URL the same way,
        // e.g. "https://us-central1-halo-2b942.cloudfunctions.net/verifyPurchase".
        // No trailing path is appended, so no trailing slash is needed here.
        def billingVerifyBaseUrl = (project.findProperty("BILLING_VERIFY_BASE_URL")
            ?: System.getenv("BILLING_VERIFY_BASE_URL")
            ?: "")
        buildConfigField "String", "BILLING_VERIFY_BASE_URL", "\"${billingVerifyBaseUrl}\""
    }

    // Release signing. The keystore + passwords come from environment variables
    // (wired to CI secrets), never committed. When absent (local/CI debug builds),
    // the release type simply isn't signed, so ordinary builds still work.
    def releaseKeystore = System.getenv("ANDROID_KEYSTORE_FILE")
    def hasReleaseSigning = releaseKeystore != null && file(releaseKeystore).exists()

    signingConfigs {
        release {
            if (hasReleaseSigning) {
                storeFile file(releaseKeystore)
                storePassword System.getenv("ANDROID_KEYSTORE_PASSWORD")
                keyAlias System.getenv("ANDROID_KEY_ALIAS")
                keyPassword System.getenv("ANDROID_KEY_PASSWORD")
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled = false
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
            if (hasReleaseSigning) {
                signingConfig signingConfigs.release
            }
        }
    }

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = "17"
    }

    buildFeatures {
        compose = true
        buildConfig = true
    }

    composeOptions {
        kotlinCompilerExtensionVersion = "1.5.10"
    }

    packagingOptions {
        resources {
            excludes += "/META-INF/{AL2.0,LGPL2.1}"
        }
    }
}

dependencies {
    // Androidx Core & Lifecycle
    implementation "androidx.core:core-ktx:1.13.1"
    // Explicit fragment >= 1.3.0 so the Activity Result APIs used for the Play
    // in-app-update flow satisfy lint's InvalidFragmentVersionForActivityResult.
    implementation "androidx.fragment:fragment:1.8.5"
    implementation "androidx.lifecycle:lifecycle-runtime-ktx:2.8.1"
    implementation "androidx.lifecycle:lifecycle-viewmodel-compose:2.8.1"
    implementation "androidx.activity:activity-compose:1.9.0"

    // Jetpack Compose
    implementation platform("androidx.compose:compose-bom:2024.06.00")
    implementation "androidx.compose.ui:ui"
    implementation "androidx.compose.ui:ui-graphics"
    implementation "androidx.compose.ui:ui-tooling-preview"
    implementation "androidx.compose.material3:material3"
    implementation "androidx.compose.material3:material3-window-size-class"
    implementation "androidx.compose.material:material-icons-extended"
    implementation "androidx.compose.foundation:foundation"
    implementation "androidx.compose.runtime:runtime"
    implementation "androidx.navigation:navigation-compose:2.7.7"

    // Room Database
    implementation "androidx.room:room-runtime:${rootProject.ext.roomVersion}"
    implementation "androidx.room:room-ktx:${rootProject.ext.roomVersion}"
    kapt "androidx.room:room-compiler:${rootProject.ext.roomVersion}"

    // WorkManager (daily reading notification)
    implementation "androidx.work:work-runtime-ktx:2.9.1"

    // Retrofit & OkHttp
    implementation "com.squareup.retrofit2:retrofit:${rootProject.ext.retrofitVersion}"
    implementation "com.squareup.retrofit2:converter-gson:${rootProject.ext.retrofitVersion}"
    implementation "com.squareup.okhttp3:okhttp:${rootProject.ext.okhttpVersion}"
    implementation "com.squareup.okhttp3:logging-interceptor:${rootProject.ext.okhttpVersion}"

    // Kotlin Coroutines
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-android:1.8.0"
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-core:1.8.0"

    // Gson
    implementation "com.google.code.gson:gson:2.10.1"

    // Google Mobile Ads (AdMob) — banner on the basic tier
    implementation "com.google.android.gms:play-services-ads:23.6.0"

    // Google Play in-app updates — prompt installed users to update
    implementation "com.google.android.play:app-update:2.1.0"
    implementation "com.google.android.play:app-update-ktx:2.1.0"

    // Google Play Billing — Halo Premium subscriptions (monthly/yearly).
    // Gated behind Features.BILLING_ENABLED.
    implementation "com.android.billingclient:billing-ktx:${rootProject.ext.billingVersion}"

    // Account login + cloud sync (Firebase Auth + Firestore) and the modern
    // Credential Manager "Sign in with Google" flow. All usage is gated behind
    // Features.AUTH_ENABLED; a placeholder google-services.json keeps builds green.
    implementation platform("com.google.firebase:firebase-bom:${rootProject.ext.firebaseBomVersion}")
    implementation "com.google.firebase:firebase-auth-ktx"
    implementation "com.google.firebase:firebase-firestore-ktx"
    implementation "androidx.credentials:credentials:${rootProject.ext.credentialsVersion}"
    implementation "androidx.credentials:credentials-play-services-auth:${rootProject.ext.credentialsVersion}"
    implementation "com.google.android.libraries.identity.googleid:googleid:${rootProject.ext.googleIdVersion}"
    // .await() for Firebase Task<T> in coroutines.
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-play-services:${rootProject.ext.coroutinesPlayServicesVersion}"

    // Core module
    implementation project(":core")

    // Testing
    testImplementation "junit:junit:4.13.2"
    testImplementation "org.jetbrains.kotlin:kotlin-test:${rootProject.ext.kotlinVersion}"
    testImplementation "org.jetbrains.kotlin:kotlin-test-junit:${rootProject.ext.kotlinVersion}"
    testImplementation "org.mockito:mockito-core:5.7.0"
    testImplementation "org.mockito.kotlin:mockito-kotlin:5.2.0"
    testImplementation "androidx.room:room-testing:${rootProject.ext.roomVersion}"
    testImplementation "org.robolectric:robolectric:4.12.2"

    // Debug
    debugImplementation "androidx.compose.ui:ui-tooling"
}
