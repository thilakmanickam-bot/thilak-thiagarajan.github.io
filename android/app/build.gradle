plugins {
    id "com.android.application"
    id "org.jetbrains.kotlin.android"
    id "kotlin-kapt"
}

android {
    namespace = "com.astrochart"
    compileSdk rootProject.ext.compileSdk

    // versionCode/versionName can be overridden from CI (VERSION_CODE / VERSION_NAME)
    // so each Play upload gets a unique, increasing code without editing the file.
    // Resolved into locals first to avoid Groovy parsing `versionCode (...).toInteger()`
    // as a method call with a chained method on its return value.
    def resolvedVersionCode = (System.getenv("VERSION_CODE") ?: rootProject.ext.versionCode.toString()).toInteger()
    def resolvedVersionName = System.getenv("VERSION_NAME") ?: rootProject.ext.versionName

    defaultConfig {
        applicationId = "com.techbyt.halo"
        minSdk rootProject.ext.minSdk
        targetSdk rootProject.ext.targetSdk
        versionCode resolvedVersionCode
        versionName resolvedVersionName

        testInstrumentationRunner = "androidx.test.runner.AndroidJUnitRunner"
        vectorDrawables.useSupportLibrary = true
    }

    // Release signing. The keystore + passwords come from environment variables
    // (wired to CI secrets), never committed. When absent (local/CI debug builds),
    // the release type simply isn't signed, so ordinary builds still work.
    def releaseKeystore = System.getenv("ANDROID_KEYSTORE_FILE")
    def hasReleaseSigning = releaseKeystore != null && file(releaseKeystore).exists()

    signingConfigs {
        release {
            if (hasReleaseSigning) {
                storeFile file(releaseKeystore)
                storePassword System.getenv("ANDROID_KEYSTORE_PASSWORD")
                keyAlias System.getenv("ANDROID_KEY_ALIAS")
                keyPassword System.getenv("ANDROID_KEY_PASSWORD")
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled = false
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
            if (hasReleaseSigning) {
                signingConfig signingConfigs.release
            }
        }
    }

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = "17"
    }

    buildFeatures {
        compose = true
        buildConfig = true
    }

    composeOptions {
        kotlinCompilerExtensionVersion = "1.5.10"
    }

    packagingOptions {
        resources {
            excludes += "/META-INF/{AL2.0,LGPL2.1}"
        }
    }
}

dependencies {
    // Androidx Core & Lifecycle
    implementation "androidx.core:core-ktx:1.13.1"
    implementation "androidx.lifecycle:lifecycle-runtime-ktx:2.8.1"
    implementation "androidx.lifecycle:lifecycle-viewmodel-compose:2.8.1"
    implementation "androidx.activity:activity-compose:1.9.0"

    // Jetpack Compose
    implementation platform("androidx.compose:compose-bom:2024.06.00")
    implementation "androidx.compose.ui:ui"
    implementation "androidx.compose.ui:ui-graphics"
    implementation "androidx.compose.ui:ui-tooling-preview"
    implementation "androidx.compose.material3:material3"
    implementation "androidx.compose.material:material-icons-extended"
    implementation "androidx.compose.foundation:foundation"
    implementation "androidx.compose.runtime:runtime"
    implementation "androidx.navigation:navigation-compose:2.7.7"

    // Room Database
    implementation "androidx.room:room-runtime:${rootProject.ext.roomVersion}"
    implementation "androidx.room:room-ktx:${rootProject.ext.roomVersion}"
    kapt "androidx.room:room-compiler:${rootProject.ext.roomVersion}"

    // WorkManager (daily reading notification)
    implementation "androidx.work:work-runtime-ktx:2.9.1"

    // Retrofit & OkHttp
    implementation "com.squareup.retrofit2:retrofit:${rootProject.ext.retrofitVersion}"
    implementation "com.squareup.retrofit2:converter-gson:${rootProject.ext.retrofitVersion}"
    implementation "com.squareup.okhttp3:okhttp:${rootProject.ext.okhttpVersion}"
    implementation "com.squareup.okhttp3:logging-interceptor:${rootProject.ext.okhttpVersion}"

    // Kotlin Coroutines
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-android:1.8.0"
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-core:1.8.0"

    // Gson
    implementation "com.google.code.gson:gson:2.10.1"

    // Google Mobile Ads (AdMob) — banner on the basic tier
    implementation "com.google.android.gms:play-services-ads:23.6.0"

    // Core module
    implementation project(":core")

    // Testing
    testImplementation "junit:junit:4.13.2"
    testImplementation "org.jetbrains.kotlin:kotlin-test:${rootProject.ext.kotlinVersion}"
    testImplementation "org.jetbrains.kotlin:kotlin-test-junit:${rootProject.ext.kotlinVersion}"
    testImplementation "org.mockito:mockito-core:5.7.0"
    testImplementation "org.mockito.kotlin:mockito-kotlin:5.2.0"
    testImplementation "androidx.room:room-testing:${rootProject.ext.roomVersion}"
    testImplementation "org.robolectric:robolectric:4.12.2"

    // Debug
    debugImplementation "androidx.compose.ui:ui-tooling"
}
