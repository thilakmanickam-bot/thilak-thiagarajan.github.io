# AndroidX configuration
android.useAndroidX=true

# Suppress build warnings for compileSdk 35 (Android 15)
android.suppressUnsupportedCompileSdk=35

# Disable Jetifier - using pure AndroidX, no legacy library conversion needed
android.enableJetifier=false

# JVM heap for the Gradle daemon. APK packaging (PackageAndroidArtifact runs
# in a NoIsolation worker sharing this heap) OOMs at Gradle's 512m default,
# so give it 4g. Note: -XX:MaxPermSize is invalid on Java 17 and would cause
# the JVM to reject the whole args line — do not add it back.
org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8
