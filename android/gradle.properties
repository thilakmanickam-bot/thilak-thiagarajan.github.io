# AndroidX configuration
android.useAndroidX=true

# Suppress build warnings for compileSdk 36 (Android 16). Google Play requires
# apps to target within one year of the latest Android release, so we target
# API 36; AGP 8.2 predates official 36 support but compiles against it fine.
android.suppressUnsupportedCompileSdk=36

# Disable Jetifier - using pure AndroidX, no legacy library conversion needed
android.enableJetifier=false

# AdMob application ID injected into the manifest at build time. Replace the
# test value below with your real "ca-app-pub-XXXXXXXXXXXXXXXX~YYYYYYYYYY" from
# AdMob → App settings. (The ad-unit IDs live in app .../ads/Ads.kt.)
ADMOB_APP_ID=ca-app-pub-3940256099942544~3347511713

# JVM heap for the Gradle daemon. APK packaging (PackageAndroidArtifact runs
# in a NoIsolation worker sharing this heap) OOMs at Gradle's 512m default,
# so give it 4g. Note: -XX:MaxPermSize is invalid on Java 17 and would cause
# the JVM to reject the whole args line — do not add it back.
org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8
