name: Release to Play Store

# Builds a signed Android App Bundle (.aab) and uploads it to Google Play.
# Trigger it manually (Actions tab → "Release to Play Store" → Run workflow) and
# choose a track, or push a tag like v1.0.1. Requires these repository secrets:
#   ANDROID_KEYSTORE_BASE64     - base64 of your release keystore (.jks/.keystore)
#   ANDROID_KEYSTORE_PASSWORD   - keystore (store) password
#   ANDROID_KEY_ALIAS           - key alias inside the keystore
#   ANDROID_KEY_PASSWORD        - key password
#   PLAY_SERVICE_ACCOUNT_JSON   - Play Console service-account JSON (full contents)
# See docs/PLAY_RELEASE.md for how to create each of these.

on:
  workflow_dispatch:
    inputs:
      track:
        description: 'Play track to release to'
        default: 'internal'
        type: choice
        options:
          - internal
          - alpha
          - beta
          - production
  push:
    tags:
      - 'v*'

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/gradle-build-action@v3
        with:
          gradle-version: 8.2

      - name: Decode release keystore
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > "$RUNNER_TEMP/release.keystore"

      - name: Build signed AAB
        run: gradle -p android app:bundleRelease --stacktrace
        env:
          ANDROID_KEYSTORE_FILE: ${{ runner.temp }}/release.keystore
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          # Unique, increasing version code per run so Play accepts each upload.
          VERSION_CODE: ${{ github.run_number }}

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-aab
          path: android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error

      - name: Upload to Google Play
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.astrochart
          releaseFiles: android/app/build/outputs/bundle/release/app-release.aab
          track: ${{ github.event.inputs.track || 'internal' }}
          status: completed
