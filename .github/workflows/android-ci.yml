name: Android CI

on:
  push:
    branches: [ main, "claude/**" ]
    paths:
      - 'android/**'
      - '.github/workflows/android-ci.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'android/**'

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/gradle-build-action@v3
        with:
          gradle-version: 8.2

      - name: Run Lint
        run: gradle -p android lint

      - name: Run Core Unit Tests
        run: gradle -p android core:test --stacktrace

      - name: Run App Unit Tests
        run: gradle -p android app:testDebugUnitTest --stacktrace

      - name: Build Debug APK
        run: gradle -p android app:assembleDebug --stacktrace

      - name: Verify bundled worldwide-location dataset
        run: |
          APK=$(find android/app/build/outputs/apk/debug -name '*.apk' | head -1)
          echo "APK: $APK"
          echo "--- assets/ entries in APK ---"
          unzip -l "$APK" | grep 'assets/' || true
          unzip -p "$APK" assets/cities500.tsv.gz > /tmp/cities500.tsv.gz
          echo "extracted size: $(wc -c < /tmp/cities500.tsv.gz) bytes"
          gunzip -t /tmp/cities500.tsv.gz && echo "gunzip integrity: OK"
          LINES=$(zcat /tmp/cities500.tsv.gz | wc -l)
          echo "line count: $LINES"
          echo "--- Singapore row ---"
          zcat /tmp/cities500.tsv.gz | grep -P '^Singapore\t'
          test "$LINES" -gt 200000

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: android/app/build/reports/

  # Publishes the built debug APK as a directly-installable file on a GitHub
  # Release, so it can be downloaded and sideloaded without digging through
  # Actions artifacts (which are zipped). Debug APKs are debug-signed, so they
  # install on any device with "install unknown apps" enabled. Runs only on
  # branch pushes; never on pull requests. Isolated from build-and-test, so a
  # publish hiccup never fails the required check.
  publish-apk:
    needs: build-and-test
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download debug APK
        uses: actions/download-artifact@v4
        with:
          name: app-debug-apk
          path: apk

      - name: Rename to a clean filename
        run: |
          mkdir -p out
          cp apk/*.apk "out/Halo-android-debug.apk"

      - name: Publish to Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-preview
          name: Halo — Android preview build
          body: |
            Latest debug build of the Halo Android app from `${{ github.ref_name }}`
            (commit ${{ github.sha }}).

            Download **Halo-android-debug.apk** below and install it on your phone
            (enable "install unknown apps" for your browser/files app). This is a
            debug build for testing.
          prerelease: true
          files: out/Halo-android-debug.apk
