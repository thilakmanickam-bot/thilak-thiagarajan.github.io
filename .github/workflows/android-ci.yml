name: Android CI

on:
  push:
    branches: [ main, "claude/**" ]
    paths:
      - 'android/**'
      - '.github/workflows/android-ci.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'android/**'

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/gradle-build-action@v3
        with:
          gradle-version: 8.2

      - name: Run Lint
        run: gradle -p android lint

      - name: Run Core Unit Tests
        run: gradle -p android core:test --stacktrace

      - name: Run App Unit Tests
        run: gradle -p android app:testDebugUnitTest --stacktrace

      - name: Build Debug APK
        run: gradle -p android app:assembleDebug --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: android/app/build/reports/

  ui-test:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Setup Gradle
        uses: gradle/gradle-build-action@v3
        with:
          gradle-version: 8.2

      - name: Run Compose UI tests and capture screenshots
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: |
            TEST_EXIT=0
            gradle -p android :app:connectedDebugAndroidTest --stacktrace || TEST_EXIT=$?
            mkdir -p screenshots
            echo "== device screenshots dir =="
            adb exec-out run-as com.astrochart ls -la files/screenshots || true
            # Pull via run-as (debug build). Use tar with explicit -f - on BOTH
            # ends so host tar reads stdin; cd into files first to avoid -C quirks.
            adb exec-out run-as com.astrochart sh -c 'cd files && tar cf - screenshots' 2>/dev/null | tar xf - -C . 2>/dev/null || true
            echo "== pulled screenshots =="
            ls -la screenshots || true
            exit $TEST_EXIT

      - name: Upload screenshots artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-screenshots
          path: screenshots/
          if-no-files-found: warn

      - name: Upload instrumented test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: instrumented-test-report
          path: android/app/build/reports/androidTests/

      - name: Publish screenshots to ci-screenshots branch
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -z "$(ls -A screenshots 2>/dev/null)" ]; then
            echo "No screenshots captured; nothing to publish."
            exit 0
          fi
          cd screenshots
          git init -q
          git checkout -q -b ci-screenshots
          git add .
          git -c user.email=ci@astrochart.app -c user.name="AstroChart CI" \
            commit -q -m "UI screenshots for ${GITHUB_SHA}"
          git push -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" ci-screenshots

