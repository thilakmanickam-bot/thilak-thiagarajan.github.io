name: Android CI

on:
  push:
    branches: [ main, "claude/**" ]
    paths:
      - 'android/**'
      - '.github/workflows/android-ci.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'android/**'

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Make gradlew executable
        run: chmod +x android/gradlew

      - name: Run Lint
        run: cd android && ./gradlew lint

      - name: Run Core Unit Tests
        run: cd android && ./gradlew core:test --stacktrace

      - name: Run App Unit Tests
        run: cd android && ./gradlew app:testDebugUnitTest --stacktrace

      - name: Build Debug APK
        run: cd android && ./gradlew app:assembleDebug --stacktrace

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: android/app/build/reports/

      - name: Comment PR with test results
        if: github.event_name == 'pull_request' && always()
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '✅ Android CI passed. Debug APK built successfully.'
            })

