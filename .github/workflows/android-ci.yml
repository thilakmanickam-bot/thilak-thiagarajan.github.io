name: Android CI

on:
  push:
    branches: [ main, "claude/**" ]
    paths:
      - 'android/**'
      - '.github/workflows/android-ci.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'android/**'

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/gradle-build-action@v3
        with:
          gradle-version: 8.2

      - name: Run Lint
        run: gradle -p android lint

      - name: Run Core Unit Tests
        run: gradle -p android core:test --stacktrace

      - name: Run App Unit Tests
        run: gradle -p android app:testDebugUnitTest --stacktrace

      - name: Build Debug APK
        run: gradle -p android app:assembleDebug --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: android/app/build/reports/

  ui-test:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Setup Gradle
        uses: gradle/gradle-build-action@v3
        with:
          gradle-version: 8.2

      # Prepared as a file because the emulator-runner executes its `script`
      # line-by-line in separate shells (so multi-line variables/logic there do
      # not persist). One bash file = one shell.
      - name: Prepare UI-test script
        run: |
          cat > ui-test.sh <<'EOF'
          set -e
          gradle -p android :app:assembleDebug :app:assembleDebugAndroidTest --stacktrace
          # Install both APKs manually and drive the tests with `am instrument`
          # so the app stays installed afterwards (Gradle's connectedAndroidTest
          # uninstalls it, which deletes the screenshots before we can pull them).
          adb install -r android/app/build/outputs/apk/debug/app-debug.apk
          adb install -r "$(find android/app/build/outputs/apk/androidTest/debug -name '*.apk' | head -1)"
          adb shell am instrument -w com.astrochart.test/androidx.test.runner.AndroidJUnitRunner | tee /tmp/instr.txt
          mkdir -p screenshots
          echo "== device screenshots =="
          adb exec-out run-as com.astrochart ls -la files/screenshots || true
          adb exec-out run-as com.astrochart sh -c 'cd files && tar cf - screenshots' 2>/dev/null | tar xf - -C . 2>/dev/null || true
          echo "== pulled screenshots =="
          ls -la screenshots || true
          grep -q "OK (" /tmp/instr.txt
          EOF

      - name: Run Compose UI tests and capture screenshots
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: bash ui-test.sh

      - name: Upload screenshots artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-screenshots
          path: screenshots/
          if-no-files-found: warn

      - name: Upload instrumented test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: instrumented-test-report
          path: android/app/build/reports/androidTests/

      - name: Publish screenshots to ci-screenshots branch
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -z "$(ls -A screenshots 2>/dev/null)" ]; then
            echo "No screenshots captured; nothing to publish."
            exit 0
          fi
          cd screenshots
          git init -q
          git checkout -q -b ci-screenshots
          git add .
          git -c user.email=ci@astrochart.app -c user.name="AstroChart CI" \
            commit -q -m "UI screenshots for ${GITHUB_SHA}"
          git push -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" ci-screenshots

